<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000">
  <defs>
    <style>
      text { font-family: 'Inter', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1440" height="1000" fill="#FFFFFF"/>

  <!-- Page Header -->
  <g transform="translate(80, 50)">
    <text x="0" y="32" font-size="28" font-weight="800" fill="#111827">Practical 2: Wireframe for Online Learning Platform (Learnly)</text>
    <text x="0" y="58" font-size="15" font-weight="500" fill="#4B5563">Wireframe Components: 1. Course Listings | 2. Video Player | 3. Quizzes | 4. Progress Tracking</text>
    <text x="1280" y="32" font-size="15" font-weight="700" fill="#2563EB" text-anchor="end">Omkar Mote (4th Year)</text>
    <line x1="0" y1="75" x2="1280" y2="75" stroke="#E5E7EB" stroke-width="2"/>
  </g>

  <!-- 4 Big Clean Wireframe Boxes (2x2 Grid) -->

  <!-- BOX 1: COURSE LISTINGS & SEARCH (Top-Left: x: 80, y: 160, w: 620, h: 360) -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="620" height="360" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="24" y="36" font-size="16" font-weight="800" fill="#111827">1. COURSE LISTINGS &amp; SEARCH</text>
    <line x1="24" y1="48" x2="596" y2="48" stroke="#D1D5DB" stroke-width="1.5"/>

    <!-- Search Input -->
    <rect x="24" y="65" width="572" height="38" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="40" y="89" font-size="13" font-weight="500" fill="#9CA3AF">Search courses (e.g. Python, Web Development)...</text>

    <!-- Course Card 1 -->
    <g transform="translate(24, 120)">
      <rect x="0" y="0" width="572" height="95" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <rect x="15" y="15" width="65" height="65" rx="6" fill="#E5E7EB"/>
      <text x="47" y="52" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">[IMG]</text>

      <text x="95" y="35" font-size="15" font-weight="700" fill="#111827">Python for Beginners (Full Course)</text>
      <text x="95" y="56" font-size="13" font-weight="500" fill="#6B7280">12 Lectures | 4 Quizzes | Duration: 5 Hours</text>
      
      <!-- Enroll Button -->
      <rect x="460" y="30" width="95" height="34" rx="6" fill="#2563EB"/>
      <text x="507" y="52" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Enroll Free</text>
    </g>

    <!-- Course Card 2 -->
    <g transform="translate(24, 230)">
      <rect x="0" y="0" width="572" height="95" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <rect x="15" y="15" width="65" height="65" rx="6" fill="#E5E7EB"/>
      <text x="47" y="52" font-size="11" font-weight="700" fill="#6B7280" text-anchor="middle">[IMG]</text>

      <text x="95" y="35" font-size="15" font-weight="700" fill="#111827">Data Structures &amp; Algorithms in Python</text>
      <text x="95" y="56" font-size="13" font-weight="500" fill="#6B7280">18 Lectures | 6 Quizzes | Duration: 8 Hours</text>

      <rect x="460" y="30" width="95" height="34" rx="6" fill="#4B5563"/>
      <text x="507" y="52" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">View Details</text>
    </g>
  </g>

  <!-- BOX 2: VIDEO LECTURE PLAYER (Top-Right: x: 740, y: 160, w: 620, h: 360) -->
  <g transform="translate(740, 160)">
    <rect x="0" y="0" width="620" height="360" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="24" y="36" font-size="16" font-weight="800" fill="#111827">2. VIDEO LECTURE PLAYER</text>
    <line x1="24" y1="48" x2="596" y2="48" stroke="#D1D5DB" stroke-width="1.5"/>

    <!-- Video Frame -->
    <g transform="translate(24, 65)">
      <rect x="0" y="0" width="572" height="210" rx="8" fill="#1F2937"/>
      
      <!-- Play Button -->
      <circle cx="286" cy="95" r="28" fill="#2563EB"/>
      <polygon points="280,84 298,95 280,106" fill="#FFFFFF"/>

      <text x="20" y="32" font-size="14" font-weight="700" fill="#FFFFFF">Lecture 03: Variables, Data Types &amp; Syntax</text>
      <text x="20" y="52" font-size="12" font-weight="500" fill="#9CA3AF">Python for Beginners - Module 1</text>

      <!-- Player Controls -->
      <rect x="20" y="165" width="532" height="30" rx="4" fill="#374151"/>
      <text x="35" y="185" font-size="12" font-weight="600" fill="#E5E7EB">04:15 / 15:00</text>
      <!-- Progress Line -->
      <rect x="130" y="178" width="120" height="4" rx="2" fill="#2563EB"/>
      <rect x="250" y="178" width="220" height="4" rx="2" fill="#6B7280"/>
      <text x="510" y="185" font-size="12" font-weight="600" fill="#E5E7EB">1080p</text>
    </g>

    <!-- Navigation below video -->
    <g transform="translate(24, 290)">
      <rect x="0" y="0" width="140" height="36" rx="6" fill="#E5E7EB"/>
      <text x="70" y="23" font-size="12" font-weight="700" fill="#374151" text-anchor="middle">Previous Lesson</text>

      <rect x="432" y="0" width="140" height="36" rx="6" fill="#2563EB"/>
      <text x="502" y="23" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Next: Take Quiz</text>
    </g>
  </g>

  <!-- BOX 3: INTERACTIVE QUIZZES (Bottom-Left: x: 80, y: 550, w: 620, h: 380) -->
  <g transform="translate(80, 550)">
    <rect x="0" y="0" width="620" height="380" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="24" y="36" font-size="16" font-weight="800" fill="#111827">3. QUIZZES &amp; ASSIGNMENTS</text>
    <text x="596" y="36" font-size="13" font-weight="700" fill="#2563EB" text-anchor="end">Question 1 of 5</text>
    <line x1="24" y1="48" x2="596" y2="48" stroke="#D1D5DB" stroke-width="1.5"/>

    <!-- Question Text -->
    <text x="24" y="80" font-size="15" font-weight="700" fill="#111827">Q1. Which of the following data types is immutable in Python?</text>

    <!-- 4 Options -->
    <g transform="translate(24, 105)">
      <!-- Option A -->
      <rect x="0" y="0" width="572" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <circle cx="25" cy="21" r="7" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
      <text x="45" y="26" font-size="14" font-weight="500" fill="#374151">A) List</text>

      <!-- Option B (Selected) -->
      <rect x="0" y="52" width="572" height="42" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <circle cx="25" cy="73" r="7" fill="#2563EB"/>
      <circle cx="25" cy="73" r="3" fill="#FFFFFF"/>
      <text x="45" y="78" font-size="14" font-weight="700" fill="#1D4ED8">B) Tuple (Selected Answer)</text>

      <!-- Option C -->
      <rect x="0" y="104" width="572" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <circle cx="25" cy="125" r="7" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
      <text x="45" y="130" font-size="14" font-weight="500" fill="#374151">C) Dictionary</text>

      <!-- Option D -->
      <rect x="0" y="156" width="572" height="42" rx="6" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <circle cx="25" cy="177" r="7" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="2"/>
      <text x="45" y="182" font-size="14" font-weight="500" fill="#374151">D) Set</text>

      <!-- Submit Button -->
      <rect x="0" y="215" width="200" height="42" rx="6" fill="#10B981"/>
      <text x="100" y="241" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Submit &amp; Next Question</text>
    </g>
  </g>

  <!-- BOX 4: PROGRESS TRACKING (Bottom-Right: x: 740, y: 550, w: 620, h: 380) -->
  <g transform="translate(740, 550)">
    <rect x="0" y="0" width="620" height="380" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="24" y="36" font-size="16" font-weight="800" fill="#111827">4. PROGRESS TRACKING &amp; ANALYTICS</text>
    <line x1="24" y1="48" x2="596" y2="48" stroke="#D1D5DB" stroke-width="1.5"/>

    <!-- Course Completion Bar -->
    <g transform="translate(24, 75)">
      <text x="0" y="16" font-size="14" font-weight="700" fill="#111827">Course Completion Progress:</text>
      <text x="572" y="16" font-size="15" font-weight="800" fill="#2563EB" text-anchor="end">60% Complete</text>

      <rect x="0" y="30" width="572" height="16" rx="8" fill="#E5E7EB"/>
      <rect x="0" y="30" width="343" height="16" rx="8" fill="#2563EB"/>
    </g>

    <!-- 3 Metrics Boxes -->
    <g transform="translate(24, 150)">
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="85" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
        <text x="16" y="28" font-size="12" font-weight="600" fill="#6B7280">LECTURES</text>
        <text x="16" y="58" font-size="20" font-weight="800" fill="#111827">6 / 10</text>
        <text x="16" y="74" font-size="11" font-weight="500" fill="#10B981">Completed</text>
      </g>

      <g transform="translate(198, 0)">
        <rect x="0" y="0" width="175" height="85" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
        <text x="16" y="28" font-size="12" font-weight="600" fill="#6B7280">QUIZZES</text>
        <text x="16" y="58" font-size="20" font-weight="800" fill="#111827">2 / 3</text>
        <text x="16" y="74" font-size="11" font-weight="500" fill="#10B981">Passed</text>
      </g>

      <g transform="translate(396, 0)">
        <rect x="0" y="0" width="176" height="85" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
        <text x="16" y="28" font-size="12" font-weight="600" fill="#6B7280">STREAK</text>
        <text x="16" y="58" font-size="20" font-weight="800" fill="#2563EB">5 Days</text>
        <text x="16" y="74" font-size="11" font-weight="500" fill="#2563EB">Active</text>
      </g>
    </g>

    <!-- Certificate Banner -->
    <g transform="translate(24, 260)">
      <rect x="0" y="0" width="572" height="65" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5"/>
      <text x="20" y="28" font-size="13" font-weight="800" fill="#B45309">Course Certificate Status: In Progress</text>
      <text x="20" y="48" font-size="12" font-weight="500" fill="#92400E">Complete the remaining 4 lectures &amp; 1 final quiz to unlock your certificate.</text>
    </g>
  </g>
</svg>