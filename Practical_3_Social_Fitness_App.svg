<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000">
  <defs>
    <style>
      text { font-family: 'Inter', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1440" height="1000" fill="#FFFFFF"/>

  <!-- Page Header -->
  <g transform="translate(80, 50)">
    <text x="0" y="32" font-size="28" font-weight="800" fill="#111827">Practical 3: Designing a Social Fitness App (PulseFit)</text>
    <text x="0" y="58" font-size="15" font-weight="500" fill="#4B5563">Mobile App Wireframes: 1. Social Feed | 2. Workout Activity Logger | 3. Goals &amp; Leaderboard</text>
    <text x="1280" y="32" font-size="15" font-weight="700" fill="#2563EB" text-anchor="end">Omkar Mote (4th Year)</text>
    <line x1="0" y1="75" x2="1280" y2="75" stroke="#E5E7EB" stroke-width="2"/>
  </g>

  <!-- 3 Simple Phone Wireframes (w: 390 each) -->

  <!-- SCREEN 1: SOCIAL FEED (x: 80, y: 160, w: 390, h: 770) -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="390" height="770" rx="20" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
    
    <!-- App Header -->
    <text x="24" y="42" font-size="18" font-weight="800" fill="#111827">PulseFit</text>
    <text x="24" y="64" font-size="14" font-weight="600" fill="#2563EB">Good morning, Omkar!</text>
    <line x1="24" y1="80" x2="366" y2="80" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Daily Summary Box -->
    <g transform="translate(24, 95)">
      <rect x="0" y="0" width="342" height="75" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="20" y="30" font-size="12" font-weight="600" fill="#6B7280">TODAY'S STEPS</text>
      <text x="20" y="56" font-size="20" font-weight="800" fill="#111827">8,420</text>

      <line x1="170" y1="12" x2="170" y2="63" stroke="#E5E7EB" stroke-width="1"/>

      <text x="190" y="30" font-size="12" font-weight="600" fill="#6B7280">CALORIES</text>
      <text x="190" y="56" font-size="20" font-weight="800" fill="#2563EB">640 kcal</text>
    </g>

    <!-- Social Feed Header -->
    <text x="24" y="200" font-size="14" font-weight="800" fill="#111827">FRIENDS WORKOUT FEED</text>

    <!-- Post 1: Rahul -->
    <g transform="translate(24, 215)">
      <rect x="0" y="0" width="342" height="150" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="14" fill="#2563EB"/>
      <text x="28" y="33" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">RS</text>
      <text x="52" y="26" font-size="14" font-weight="700" fill="#111827">Rahul Sharma</text>
      <text x="52" y="42" font-size="12" font-weight="500" fill="#6B7280">Completed 5 km Run</text>

      <text x="20" y="80" font-size="13" font-weight="500" fill="#374151">Pushed my personal best pace today!</text>
      
      <!-- Metrics & Cheer button -->
      <rect x="20" y="98" width="100" height="32" rx="6" fill="#EFF6FF"/>
      <text x="70" y="119" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">High Five (24)</text>

      <rect x="130" y="98" width="100" height="32" rx="6" fill="#F3F4F6"/>
      <text x="180" y="119" font-size="12" font-weight="600" fill="#4B5563" text-anchor="middle">Comment (5)</text>
    </g>

    <!-- Post 2: Priya -->
    <g transform="translate(24, 385)">
      <rect x="0" y="0" width="342" height="150" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="14" fill="#10B981"/>
      <text x="28" y="33" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">PP</text>
      <text x="52" y="26" font-size="14" font-weight="700" fill="#111827">Priya Patel</text>
      <text x="52" y="42" font-size="12" font-weight="500" fill="#6B7280">Leg Day Gym Session</text>

      <text x="20" y="80" font-size="13" font-weight="500" fill="#374151">Completed 5 sets of squats @ 70 kg.</text>

      <rect x="20" y="98" width="100" height="32" rx="6" fill="#EFF6FF"/>
      <text x="70" y="119" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">High Five (18)</text>
    </g>

    <!-- Bottom Nav -->
    <g transform="translate(0, 715)">
      <line x1="0" y1="0" x2="390" y2="0" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="65" y="35" font-size="13" font-weight="800" fill="#2563EB" text-anchor="middle">Feed</text>
      <text x="195" y="35" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">Workout</text>
      <text x="325" y="35" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">Goals</text>
    </g>
  </g>

  <!-- SCREEN 2: WORKOUT LOGGER (x: 525, y: 160, w: 390, h: 770) -->
  <g transform="translate(525, 160)">
    <rect x="0" y="0" width="390" height="770" rx="20" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>

    <!-- App Header -->
    <text x="24" y="42" font-size="18" font-weight="800" fill="#111827">Workout Logger</text>
    <text x="24" y="64" font-size="14" font-weight="600" fill="#10B981">Session: Chest &amp; Triceps</text>
    <line x1="24" y1="80" x2="366" y2="80" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Simple Timer Box -->
    <g transform="translate(24, 95)">
      <rect x="0" y="0" width="342" height="95" rx="10" fill="#1F2937"/>
      <text x="171" y="36" font-size="12" font-weight="700" fill="#9CA3AF" text-anchor="middle">WORKOUT DURATION</text>
      <text x="171" y="72" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">00:36:42</text>
    </g>

    <text x="24" y="220" font-size="14" font-weight="800" fill="#111827">EXERCISES IN SESSION</text>

    <!-- Exercise 1 -->
    <g transform="translate(24, 235)">
      <rect x="0" y="0" width="342" height="70" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="16" y="28" font-size="14" font-weight="700" fill="#111827">1. Bench Press</text>
      <text x="326" y="28" font-size="12" font-weight="700" fill="#10B981" text-anchor="end">Done (3/3)</text>
      <text x="16" y="50" font-size="12" font-weight="500" fill="#6B7280">3 sets x 10 reps @ 60 kg</text>
    </g>

    <!-- Exercise 2 -->
    <g transform="translate(24, 320)">
      <rect x="0" y="0" width="342" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <text x="16" y="28" font-size="14" font-weight="700" fill="#1D4ED8">2. Dumbbell Press</text>
      <text x="326" y="28" font-size="12" font-weight="700" fill="#2563EB" text-anchor="end">In Progress</text>
      <text x="16" y="50" font-size="12" font-weight="500" fill="#4B5563">Target: 3 sets x 10 reps @ 24 kg</text>
    </g>

    <!-- Exercise 3 -->
    <g transform="translate(24, 405)">
      <rect x="0" y="0" width="342" height="70" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="16" y="28" font-size="14" font-weight="700" fill="#111827">3. Cable Pushdowns</text>
      <text x="326" y="28" font-size="12" font-weight="600" fill="#9CA3AF" text-anchor="end">Upcoming</text>
      <text x="16" y="50" font-size="12" font-weight="500" fill="#6B7280">Target: 3 sets x 15 reps</text>
    </g>

    <!-- Complete Workout Button -->
    <g transform="translate(24, 505)">
      <rect x="0" y="0" width="342" height="48" rx="8" fill="#10B981"/>
      <text x="171" y="29" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Finish Workout &amp; Post</text>
    </g>

    <!-- Bottom Nav -->
    <g transform="translate(0, 715)">
      <line x1="0" y1="0" x2="390" y2="0" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="65" y="35" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">Feed</text>
      <text x="195" y="35" font-size="13" font-weight="800" fill="#10B981" text-anchor="middle">Workout</text>
      <text x="325" y="35" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">Goals</text>
    </g>
  </g>

  <!-- SCREEN 3: GOALS & LEADERBOARD (x: 970, y: 160, w: 390, h: 770) -->
  <g transform="translate(970, 160)">
    <rect x="0" y="0" width="390" height="770" rx="20" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>

    <!-- App Header -->
    <text x="24" y="42" font-size="18" font-weight="800" fill="#111827">Goals &amp; Rankings</text>
    <text x="24" y="64" font-size="14" font-weight="600" fill="#8B5CF6">Weekly Consistency: On Track</text>
    <line x1="24" y1="80" x2="366" y2="80" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Weekly Goal Card -->
    <g transform="translate(24, 95)">
      <rect x="0" y="0" width="342" height="90" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <text x="16" y="28" font-size="13" font-weight="700" fill="#111827">Weekly Goal: 5 Workouts</text>
      <text x="326" y="28" font-size="13" font-weight="800" fill="#2563EB" text-anchor="end">4 / 5 Done</text>

      <!-- Progress bar -->
      <rect x="16" y="42" width="310" height="12" rx="6" fill="#E5E7EB"/>
      <rect x="16" y="42" width="248" height="12" rx="6" fill="#2563EB"/>
      <text x="16" y="74" font-size="12" font-weight="500" fill="#6B7280">1 more session needed to reach goal!</text>
    </g>

    <!-- Leaderboard Header -->
    <text x="24" y="220" font-size="14" font-weight="800" fill="#111827">FRIENDS LEADERBOARD</text>

    <!-- Rank 1: Rahul -->
    <g transform="translate(24, 235)">
      <rect x="0" y="0" width="342" height="52" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <circle cx="25" cy="26" r="14" fill="#FEF3C7"/>
      <text x="25" y="31" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle">1</text>
      <text x="50" y="31" font-size="14" font-weight="700" fill="#111827">Rahul Sharma</text>
      <text x="326" y="31" font-size="13" font-weight="700" fill="#2563EB" text-anchor="end">1,850 pts</text>
    </g>

    <!-- Rank 2: Omkar -->
    <g transform="translate(24, 300)">
      <rect x="0" y="0" width="342" height="52" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
      <circle cx="25" cy="26" r="14" fill="#BFDBFE"/>
      <text x="25" y="31" font-size="12" font-weight="800" fill="#1D4ED8" text-anchor="middle">2</text>
      <text x="50" y="31" font-size="14" font-weight="700" fill="#1D4ED8">Omkar Mote (You)</text>
      <text x="326" y="31" font-size="13" font-weight="700" fill="#1D4ED8" text-anchor="end">1,620 pts</text>
    </g>

    <!-- Rank 3: Priya -->
    <g transform="translate(24, 365)">
      <rect x="0" y="0" width="342" height="52" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
      <circle cx="25" cy="26" r="14" fill="#F3F4F6"/>
      <text x="25" y="31" font-size="12" font-weight="800" fill="#6B7280" text-anchor="middle">3</text>
      <text x="50" y="31" font-size="14" font-weight="700" fill="#111827">Priya Patel</text>
      <text x="326" y="31" font-size="13" font-weight="700" fill="#6B7280" text-anchor="end">1,400 pts</text>
    </g>

    <!-- Bottom Nav -->
    <g transform="translate(0, 715)">
      <line x1="0" y1="0" x2="390" y2="0" stroke="#E5E7EB" stroke-width="1.5"/>
      <text x="65" y="35" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">Feed</text>
      <text x="195" y="35" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">Workout</text>
      <text x="325" y="35" font-size="13" font-weight="800" fill="#8B5CF6" text-anchor="middle">Goals</text>
    </g>
  </g>
</svg>